<title>Wobbly Raccoon</title>
<style>
  :root {
    --ground: #eae4d8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --ground: #15181f; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --ground: #15181f; }

  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* The canvas fills the frame; game.js sizes it at the real pixel density. */
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
</style>

<canvas id="game"></canvas>

<script src="game.js"></script>
